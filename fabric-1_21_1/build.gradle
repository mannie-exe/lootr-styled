plugins { alias(libs.plugins.loom.remap) }
apply from: rootProject.file('gradle/native-common.gradle')
repositories { maven { url = 'https://maven.shedaniel.me/' } }
loom {
    mods {
        lootr_styled {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
    runs {
        client { client(); runDir 'runs/client' }
    }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api.legacy
    modImplementation 'maven.modrinth:lootr:nar56EsW'
    modRuntimeOnly libs.cloth
}
