plugins { alias(libs.plugins.moddev) }
apply from: rootProject.file('gradle/native-common.gradle')
neoForge {
    version = libs.versions.neoforge.legacy.get()
    addModdingDependenciesTo sourceSets.test
    mods {
        lootr_styled {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
    runs {
        client { client(); gameDirectory = file('runs/client') }
    }
}
dependencies {
    implementation 'maven.modrinth:lootr:SPOrIzX8'
}
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
