plugins { alias(libs.plugins.loom) }
apply from: rootProject.file('common.gradle')
loom {
    mods { lootr_styled_probe { sourceSet sourceSets.main } }
    runs { client { client(); runDir "runs/${fixtureDirectory}"; vmArg '-Xmx2G' } }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation libs.fabric.loader
    implementation libs.fabric.api.modern
    implementation 'maven.modrinth:lootr:gVwn7m2v'
    implementation files(productJar)
    if (fixtureMode != 'native') {
        implementation files(rootProject.file('../build/inputs/entity_model_features-3.3.12-26.3-fabric.jar'))
        implementation files(rootProject.file('../build/inputs/entity_texture_features-7.2.7-26.3-fabric.jar'))
    }
}
sourceSets.main.resources.srcDir rootProject.file('minecraft-26_3/src/main/resources')
