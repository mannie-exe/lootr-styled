pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    versionCatalogs { libs { from(files('../gradle/libs.versions.toml')) } }
}
rootProject.name = 'lootr-styled-native-verification'
def targets = ['fabric-1_21_1', 'neoforge-1_21_1', 'fabric-26_3', 'neoforge-26_3']
def selected = providers.gradleProperty('probeTarget').orNull
if (selected != null && !targets.contains(selected)) {
    throw new GradleException('Unknown native probe target')
}
(selected == null ? targets : [selected]).each { include it }
