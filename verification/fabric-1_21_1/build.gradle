plugins { alias(libs.plugins.loom.remap) }
apply from: rootProject.file('common.gradle')
loom {
    mods { lootr_styled_probe { sourceSet sourceSets.main } }
    runs { client { client(); runDir "runs/${fixtureDirectory}"; vmArg '-Xmx2G' } }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api.legacy
    modImplementation 'maven.modrinth:lootr:nar56EsW'
    modImplementation files(productJar)
    modImplementation libs.cloth
    if (fixtureMode != 'native') {
        modImplementation files(rootProject.file('../build/inputs/entity_model_features-3.3.12-1.21-fabric.jar'))
        modImplementation files(rootProject.file('../build/inputs/entity_texture_features-7.2.7-1.21-fabric.jar'))
    }
}
sourceSets.main.resources.srcDir rootProject.file('minecraft-1_21_1/src/main/resources')
