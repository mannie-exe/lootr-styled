plugins { id 'java-library' }

dependencies {
    compileOnly libs.gson
    testImplementation libs.gson
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher
}

tasks.named('test') {
    if (providers.gradleProperty('proofVectors').isPresent()) {
        def vectors = rootProject.file(providers.gradleProperty('proofVectors').get())
        inputs.file vectors
        systemProperty 'lootr.styled.proofVectors', vectors.absolutePath
    }
}

tasks.named('processTestResources') {
    from(rootProject.file('proofs/source-vectors.csv')) { into 'proofs' }
    from rootProject.file('resources')
}
