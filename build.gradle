plugins {
    id 'base'
    alias(libs.plugins.loom) apply false
    alias(libs.plugins.loom.remap) apply false
    alias(libs.plugins.moddev) apply false
    alias(libs.plugins.spotless)
}

repositories { mavenCentral() }

spotless {
    java {
        target 'platform/**/src/**/*.java', 'minecraft-*/src/**/*.java'
        googleJavaFormat(libs.versions.google.java.format.get())
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

allprojects {
    group = 'design.inherent.lootr_styled'
    version = rootProject.providers.gradleProperty('mod_version').get()
}

subprojects {
    apply plugin: 'com.diffplug.spotless'
    repositories { mavenCentral() }
    plugins.withId('java') {
        def release = project.name.endsWith('26_3') ? 25 : 21
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(release)
            withSourcesJar()
        }
        tasks.withType(JavaCompile).configureEach {
            options.release = release
            options.encoding = 'UTF-8'
            options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
        }
        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            maxParallelForks = 1
        }
        tasks.withType(AbstractArchiveTask).configureEach {
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
        tasks.withType(Jar).configureEach {
            from rootProject.file('LICENSE'), rootProject.file('NOTICE')
        }
        spotless {
            java {
                target 'src/**/*.java'
                googleJavaFormat(rootProject.libs.versions.google.java.format.get())
                removeUnusedImports()
                trimTrailingWhitespace()
                endWithNewline()
            }
        }
    }
}

tasks.register('checkDocs', Exec) {
    commandLine 'python3', 'tools/check_docs.py'
    inputs.files(fileTree('.') {
        include '**/*.md'
        exclude '**/build/**', '**/.gradle/**', '**/runs/**', '**/.git/**', 'artifacts/**'
    })
    inputs.file 'tools/check_docs.py'
}

tasks.register('stageDistribution', Sync) {
    into layout.buildDirectory.dir('distributions')
    ['fabric-1_21_1', 'neoforge-1_21_1', 'fabric-26_3', 'neoforge-26_3'].each { target ->
        def product = project(":$target")
        def installable = target == 'fabric-1_21_1' ? 'remapJar' : 'jar'
        dependsOn product.tasks.named(installable), product.tasks.named('sourcesJar')
        from product.tasks.named(installable)
        from product.tasks.named('sourcesJar')
    }
}

tasks.register('verifyDistribution', Exec) {
    dependsOn 'stageDistribution'
    commandLine 'python3', 'tools/verify_distribution.py', project.version.toString()
}

tasks.register('toolTests', Exec) {
    dependsOn 'verifyDistribution'
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'tools/tests', '-v'
}

tasks.named('check') {
    dependsOn 'checkDocs', 'verifyDistribution', 'toolTests'
    subprojects.each { dependsOn "${it.path}:check" }
}

tasks.named('assemble') { dependsOn 'stageDistribution' }
