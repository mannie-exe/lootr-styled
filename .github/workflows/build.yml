name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      retain_artifacts:
        description: Upload review artifacts for three days
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Check and build four native targets
        run: ./gradlew --no-daemon check build
      - name: Record distribution checksums
        run: >-
          python -c "import hashlib,pathlib; print(chr(10).join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(pathlib.Path('build/distributions').glob('*.jar'))))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'workflow_dispatch' && inputs.retain_artifacts
        with:
          name: lootr-styled-${{ matrix.os }}
          path: build/distributions/*
          if-no-files-found: error
          retention-days: 3
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: mise run check:docs
      - run: mise run check:ci
  proofs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: python3 tools/setup_proofs.py
      - run: python3 tools/check_proofs.py
      - run: node tools/proof_vectors.mjs
  security:
    uses: ./.github/workflows/security.yml
