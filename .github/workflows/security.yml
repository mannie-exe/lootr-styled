name: security
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 3'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Resolve core and test inventory
        run: ./gradlew --no-daemon -I tools/security.init.gradle :core:securityDependencies --write-locks
      - name: Scan core and test dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2 # renovate: depName=aquasecurity/trivy
          scan-type: fs
          scan-ref: build/security
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          trivy-config: trivy.yaml
      - name: Scan source secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          trivy-config: trivy.yaml
